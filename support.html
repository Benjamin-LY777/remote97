<title data-i18n="support.title">Remote97 — Support Center</title>
<meta name="description" content="Remote97 (影控中心) support center: add devices, supported devices & protocols, custom remotes, scenes, troubleshooting, languages.">
<style>
  :root { --accent:#7C5CFF; --fg:#1a1a1a; --muted:#666; --line:#e3e0d8; --bg:#faf9f6; --card:#fff; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
         max-width:860px; margin:0 auto; padding:24px 20px 64px; color:var(--fg); background:var(--bg); line-height:1.75; }
  .langbar{display:flex;gap:8px;justify-content:center;margin:0 auto 22px}
  .langbar button{width:36px;height:24px;border:1px solid var(--line);border-radius:4px;padding:0;cursor:pointer;background:none;opacity:.5;transition:opacity .15s}
  .langbar button:hover{opacity:.85}
  .langbar button.active{opacity:1;border-color:var(--accent)}
  .langbar button svg{display:block;width:100%;height:100%;border-radius:3px}
  h1 { font-size:28px; margin:0 0 4px; }
  h2 { font-size:20px; color:var(--accent); margin-top:36px; border-bottom:2px solid var(--accent); padding-bottom:6px; }
  h3 { font-size:16px; margin:22px 0 6px; }
  p, li { color:#333; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 20px; margin:14px 0; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .btn { display:inline-block; background:var(--accent); color:#fff; padding:10px 18px; border-radius:8px; font-weight:600; margin:6px 8px 6px 0; }
  .btn.ghost { background:transparent; color:var(--accent); border:1px solid var(--accent); }
  ul { padding-left:20px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin:12px 0; }
  .gitem { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .gitem strong { display:block; font-size:14px; margin-bottom:2px; }
  .gitem span { color:var(--muted); font-size:12.5px; }
  footer { margin-top:48px; padding-top:16px; border-top:1px solid var(--line); color:var(--muted); font-size:13px; }
  code { background:#f0ecff; padding:1px 6px; border-radius:5px; font-size:13px; }
</style>
</head>

le cx="24" cy="20" r="3.5" fill="#FF0000"/><rect width="60" height="40" fill="none" stroke="rgba(128,128,128,.25)" stroke-width="1"/></svg></button></div>
